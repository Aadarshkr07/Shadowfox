<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast</title>

    <link rel="stylesheet" href="wstyle.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <div class="background"></div>

    <div class="container">

        <!-- Search -->
        <div class="search-box">

            <input type="text"
                id="city"
                placeholder="Enter State or City">

            <button id="searchBtn">
                <i class="fas fa-search"></i>
            </button>

        </div>

        <div class="weather-card">

            <div class="top">

                <div>

                    <h1 id="location">New Delhi</h1>

                    <p id="date">
                        Wednesday, 30 July
                    </p>

                </div>

                <div class="icon">

                    <img
                        id="weatherIcon"
                       src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSGy40PIx_k5kgeeHb2bLXiLbBmK1-zGqLn6fdTdFHLIQ&s=10"                     alt="Weather">

                </div>

            </div>

            <div class="middle">

                <h2 id="temp">32°C</h2>

                <p id="description">
                    Clear Sky
                </p>

            </div>

            <div class="details">

                <div class="detail">

                    <i class="wi wi-humidity"></i>

                    <span id="humidity">65%</span>

                    <small>Humidity</small>

                </div>

                <div class="detail">

                    <i class="wi wi-strong-wind"></i>

                    <span id="wind">12 km/h</span>

                    <small>Wind</small>

                </div>

                <div class="detail">

                    <i class="wi wi-barometer"></i>

                    <span id="pressure">1008</span>

                    <small>Pressure</small>

                </div>

            </div>

        </div>

        <h2 class="forecast-title">
            5-Day Forecast
        </h2>

        <div class="forecast" id="forecast">

            <div class="forecast-card">

                <p>Thu</p>

                <img src="https://openweathermap.org/img/wn/02d@2x.png">

                <h3>30°C</h3>

            </div>

            <div class="forecast-card">

                <p>Fri</p>

                <img src="https://openweathermap.org/img/wn/10d@2x.png">

                <h3>28°C</h3>

            </div>

            <div class="forecast-card">

                <p>Sat</p>

                <img src="https://openweathermap.org/img/wn/04d@2x.png">

                <h3>29°C</h3>

            </div>

            <div class="forecast-card">

                <p>Sun</p>

                <img src="https://openweathermap.org/img/wn/01d@2x.png">

                <h3>33°C</h3>

            </div>

            <div class="forecast-card">

                <p>Mon</p>

                <img src="https://openweathermap.org/img/wn/03d@2x.png">

                <h3>31°C</h3>

            </div>

        </div>

    </div>

    <script src="wscript.js"></script>

</body>
</html>
